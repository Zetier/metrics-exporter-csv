[package]
name = "metrics-exporter-csv"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
chrono = "0.4"
csv-async = "1.3.1"
event-listener = "5.4"
itertools = "0.12"
metrics = "0.24"
metrics-util = "0.20"
smol = "2.0.2"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
tokio = ["dep:tokio"]

[workspace]
members = [
    ".",
    "tools/long2wide",
]
resolver = "2"
